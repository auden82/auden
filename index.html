  .auden-sign { width:min(82vw,1100px); height:auto; overflow:visible; }
  .tube {

    stroke-width:.7;
    filter: drop-shadow(0 0 2px #fff7dc)

  }
  .neon { animation: startup 3.25s linear 1 both, idle 9s 3.25s infinite; transform-origin:center; }

    0%,5%   { opacity:0; }
    6%      { opacity:.16; }
    8%      { opacity:0; }
    10%     { opacity:.72; }
    12%     { opacity:.08; }
    15%     { opacity:.9; }
    18%     { opacity:.25; }
    22%     { opacity:1; }
    25%     { opacity:.42; }
    28%,34% { opacity:1; }
    35%     { opacity:.58; }
    37%,100%{ opacity:1; }
  }
  @keyframes idle {
    0%,71%,73%,75%,100% { opacity:1; }
    72% { opacity:.82; }
    74% { opacity:.94; }
  }
  @media (prefers-reduced-motion: reduce) { .neon { animation:none; } }
</style>
